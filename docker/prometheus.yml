global:
  scrape_interval: 30s       # Lightweight — scrape every 30s (saves CPU vs default 15s)
  evaluation_interval: 30s

scrape_configs:
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'loot-raiders-vps'

  - job_name: 'dragonfly'
    static_configs:
      - targets: ['dragonfly-cache:6379']
    metrics_path: /metrics

  - job_name: 'shlink'
    static_configs:
      - targets: ['shlink-service:8080']
    metrics_path: /metrics
